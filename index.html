<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121619" media="(prefers-color-scheme: dark)">
<title>제주 2박 3일 · 2026.11.14–16</title>
<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#1c2227; --mute:#5c646b; --line:#e4dccf;
  --acc:#a84a00; --acc-fill:#bf5406; --acc-soft:#fde9d5; --sea:#0b6e69; --sea-soft:#dcf1ee;
  --warn:#8f4400; --warn-bg:#fff1dc; --warn-line:#f3d3a4; --chip:#efe9df;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121619; --card:#1b2125; --ink:#eef1f2; --mute:#98a2a9; --line:#2c353b;
  --acc:#ff9d4a; --acc-fill:#bf5406; --acc-soft:#3a2a1a; --sea:#5fd4c8; --sea-soft:#15302e;
  --warn:#ffc27a; --warn-bg:#33260f; --warn-line:#5a431c; --chip:#262e33;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;
  background:var(--acc-soft);color:var(--acc);border:0;white-space:nowrap}
.pill.lock{background:var(--chip);color:var(--mute);cursor:pointer}
.pill.open{background:var(--sea-soft);color:var(--sea)}
.pill svg{width:14px;height:14px}

/* 화면 */
.view{display:none;padding-top:16px}
.view.on{display:block}
h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px}
h3{font-size:15px;font-weight:800;margin:0 0 8px}
.sec{font-size:13px;font-weight:700;color:var(--mute);margin:22px 4px 8px;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}
.muted{color:var(--mute)}
.small{font-size:13px}

/* 홈 */
.hero{border-radius:20px;padding:20px;margin-bottom:12px;color:#fff;
  background:linear-gradient(140deg,#0a5f5b 0%,#0c7a6f 55%,#b85208 135%)}
.hero .when{font-size:14px;opacity:.9}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.hero .sub{font-size:14px;opacity:.92}
.next{display:flex;gap:12px;align-items:center;cursor:pointer}
.next .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--acc-fill);box-shadow:0 0 0 5px var(--acc-soft)}
.next b{display:block;font-size:16px}
.next .in{color:var(--acc);font-weight:700}
.after{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);list-style:none;font-size:14px;color:var(--mute)}
.after li{display:flex;gap:10px;padding:2px 0}
.after time{flex:none;width:86px}
.alert{background:var(--warn-bg);border-color:var(--warn-line)}
.alert h3{color:var(--warn);display:flex;gap:8px;align-items:flex-start}
.alert h3 svg{flex:none;width:18px;height:18px;margin-top:2px}
.alert p{margin:0 0 10px;font-size:14.5px}
.day h3{display:flex;align-items:baseline;gap:8px;font-size:17px}
.day h3 span{font-size:13px;font-weight:600;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl li[data-go]{cursor:pointer}
.tl time{font-weight:700;color:var(--sea)}
.tl b{display:block;font-size:15px}
.tl span{font-size:13.5px;color:var(--mute)}
.tl .todo b{color:var(--mute);font-weight:600}
.tl .todo{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 45%,transparent) 8px 9px);border-radius:8px}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}

/* 버튼 */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--acc-fill);border-color:var(--acc-fill);color:#fff}
.btn.sea{background:var(--sea-soft);border-color:transparent;color:var(--sea)}
.btn svg{width:17px;height:17px}
.btn.mini{min-height:32px;padding:0 10px;font-size:13px;border-radius:9px}

/* 표 형태 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.kv dt{color:var(--mute);white-space:nowrap}
.kv dd{margin:0;font-weight:600}
.kv dd .muted{font-weight:400}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mute);font-size:13px;border-top:0}
tr.now td{background:var(--acc-soft);font-weight:700}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--mute)}
details[open] summary{margin-bottom:8px}
ul.plain{margin:0;padding-left:18px;font-size:14.5px}
ul.plain li{margin:4px 0}

/* 항공권 */
.pass{padding:0;overflow:hidden}
.pass .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--sea-soft);color:var(--sea);font-weight:700;font-size:14px}
.pass .bd{padding:16px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:14px}
.route .t{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.route .p{font-size:14px;color:var(--mute)}
.route .r{text-align:right}
.route .mid{text-align:center;font-size:12.5px;color:var(--mute)}
.route .mid b{display:block;color:var(--ink);font-size:14px}
.route .mid i{display:block;height:0;border-top:2px dashed var(--line);margin:5px 0;min-width:64px}
.pnr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.pnr .lab{font-size:12.5px;color:var(--mute);display:block}
.pnr .val{font-size:22px;font-weight:800}
.pnr .grow{flex:1;min-width:120px}
.locked{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--chip);color:var(--mute);font-size:14px;cursor:pointer}
.locked svg{flex:none;width:18px;height:18px}

/* 맛집 */
.search{position:sticky;top:49px;z-index:10;background:var(--bg);padding:8px 0 6px;margin:0 -2px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--mute);margin:8px 4px}
.food{padding:14px 16px}
.food .nm{display:flex;align-items:flex-start;gap:8px}
.food .nm b{font-size:16.5px;flex:1;min-width:0}
.food .nm b small{font-weight:500;color:var(--mute);font-size:13px}
.grade{flex:none;min-width:30px;text-align:center;border-radius:8px;padding:1px 7px;font-weight:800;font-size:13.5px;background:var(--chip);color:var(--mute)}
.grade.g-AA{background:var(--acc-fill);color:#fff}
.grade.g-A{background:var(--acc-soft);color:var(--acc)}
.grade.g-5{background:var(--sea-soft);color:var(--sea)}
.food .meta{font-size:13.5px;color:var(--mute);margin-top:2px}
.food .memo{font-size:14.5px;margin-top:6px}
.food .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.star{margin-left:auto;border:0;background:none;padding:4px;cursor:pointer;color:var(--mute);line-height:0}
.star svg{width:22px;height:22px}
.star[aria-pressed=true]{color:var(--acc-fill)}
.star[aria-pressed=true] svg{fill:currentColor}
.src{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px}

/* 체크리스트 */
.chk{list-style:none;margin:0;padding:0}
.chk li{border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;cursor:pointer}
.chk input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--acc-fill)}
.chk input:checked + span{color:var(--mute);text-decoration:line-through}
.chk .del{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--acc-fill);border-radius:99px;transition:width .2s}

/* 하단 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav button{border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);cursor:pointer}
nav button svg{width:23px;height:23px}
nav button[aria-current=page]{color:var(--acc)}

/* 잠금 해제 창, 알림 */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;margin:10px 0 4px}
.err{color:#c0392b;font-size:13.5px;min-height:20px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s;z-index:50;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>제주 2박 3일<small class="num">11.14–16</small></h1>
  <span class="pill num" id="dday"></span>
  <button class="pill lock" id="lockBtn" type="button" hidden></button>
</div></header>

<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-flight"></section>
  <section class="view" id="v-car"></section>
  <section class="view" id="v-stay"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-check"></section>
</main>

<nav aria-label="화면 이동"><div id="tabs"></div></nav>

<dialog id="unlock">
  <h2 style="font-size:17px;margin:0 0 8px">잠긴 정보 열기</h2>
  <p class="small muted" style="margin:0">예약번호, 탑승객 이름, 결제 금액은 암호화되어 있습니다. 텔레그램으로 받은 전체 주소나 열쇠를 붙여 넣으세요. 한 번 열면 이 기기에 기억됩니다.</p>
  <input id="keyIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="전체 주소 또는 열쇠">
  <div class="err" id="keyErr"></div>
  <div class="btns" style="margin-top:6px"><button class="btn pri" id="keyGo" type="button">열기</button><button class="btn" id="keyNo" type="button">닫기</button></div>
</dialog>

<script>

const kst = iso => new Date(iso + ':00+09:00');

// ── 이름 치환, 링크 ────────────────────────────────────────────
function nm(text) {
  return String(text)
    .replaceAll('{JH}', P ? P.names.JH : '예약자')
    .replaceAll('{FAM}', '가족 4명');
}
const naverSearch = q => 'https://map.naver.com/p/search/' + encodeURIComponent(q);
const kakaoSearch = q => 'https://map.kakao.com/?q=' + encodeURIComponent(q);
const googleSearch = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
function telHref(t) {
  const d = t.replace(/[^0-9]/g, '');
  return 'tel:' + (/^(0|1[56]\d\d)/.test(d) ? d : '064' + d);
}
function telText(t) { return /^(0|1[56]\d\d)/.test(t) ? t : '064-' + t; }
function copyBtn(text, label = '복사') {
  return `<button class="btn mini" type="button" data-copy="${esc(text)}">${ICON.copy}${esc(label)}</button>`;
}
function lockedBox(what) {
  return `<div class="locked" data-unlock>${ICON.lock}<span>${esc(what)}은(는) 잠겨 있습니다. 눌러서 열기</span></div>`;
}

// ── 날짜 계산 ─────────────────────────────────────────────────
function kstDay(d = new Date()) { // KST 달력 날짜를 일 단위 숫자로
  return Math.floor((d.getTime() + 9 * 3600e3) / 86400e3);
}
const dayNum = ymd => kstDay(new Date(ymd + 'T12:00:00+09:00'));
function untilText(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return '곧';
  if (m < 60) return `${m}분 후`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}시간 ${m % 60}분 후`;
  return `${Math.floor(h / 24)}일 ${h % 24}시간 후`;
}
function fmtAt(iso) {
  const d = kst(iso), k = new Date(d.getTime() + 9 * 3600e3);
  return `${k.getUTCMonth() + 1}/${k.getUTCDate()} (${DOW[k.getUTCDay()]}) ${iso.slice(11)}`;
}
function tripPhase() {
  const t = kstDay(), s = dayNum(TRIP.start), e = dayNum(TRIP.end);
  if (t < s) return { k: 'before', n: s - t };
  if (t > e) return { k: 'after' };
  return { k: 'during', n: t - s + 1 };
}

// ── 홈 ───────────────────────────────────────────────────────
function renderHome() {
  const ph = tripPhase();
  const big = ph.k === 'before' ? `D-${ph.n}` : ph.k === 'during' ? `${ph.n}일차` : '다녀옴';
  const sub = ph.k === 'before' ? '출발까지 남은 날' : ph.k === 'during' ? '여행 중' : '여행이 끝났습니다';
  $('#dday').textContent = big;

  const now = Date.now();
  const upcoming = TRIP.clock.filter(c => kst(c[0]).getTime() > now);
  let nextHtml = '<p class="muted" style="margin:0">남은 확정 일정이 없습니다.</p>';
  if (upcoming.length) {
    const [iso, label, go] = upcoming[0];
    nextHtml = `<div class="next" data-go="${go}"><span class="dot"></span><div>
        <span class="small muted">다음 일정 · <span class="num">${fmtAt(iso)}</span></span>
        <b>${esc(nm(label))}</b><span class="in num">${untilText(kst(iso).getTime() - now)}</span></div></div>` +
      (upcoming.length > 1 ? `<ul class="after">${upcoming.slice(1, 4).map(c =>
        `<li><time class="num">${fmtAt(c[0]).replace(/ \(.\)/, '')}</time><span>${esc(nm(c[1]))}</span></li>`).join('')}</ul>` : '');
  }

  const alerts = TRIP.alerts.filter(a => !a.until || kst(a.until).getTime() > now).map(a => `
    <div class="card alert"><h3>${ICON.warn}<span>${esc(nm(a.title))}</span></h3><p>${esc(nm(a.body))}</p>
      <button class="btn mini" type="button" data-go="${a.go}">자세히 보기</button></div>`).join('');

  const today = kstDay();
  const days = TRIP.days.map(d => `
    <div class="card day"><h3>${esc(d.label)} <span class="num">${+d.date.slice(5, 7)}/${+d.date.slice(8)} (${d.dow})${dayNum(d.date) === today ? ' · 오늘' : ''}</span></h3>
      <ul class="tl">${d.items.map(it => `
        <li${it.todo ? ' class="todo"' : ''}${it.go ? ` data-go="${it.go}"` : ''}><time class="num">${esc(it.t || '—')}</time>
          <div><b>${esc(nm(it.title))}</b><span>${esc(nm(it.sub || ''))}</span></div></li>`).join('')}</ul></div>`).join('');

  const contacts = TRIP.contacts.map(c => `
    <tr><td><b>${esc(c[0])}</b><br><span class="small muted">${esc(c[2])}</span></td>
      <td style="text-align:right"><a class="btn mini sea" href="${telHref(c[1])}">${ICON.tel}<span class="num">${esc(c[1])}</span></a></td></tr>`).join('');

  $('#v-home').innerHTML = `
    <h2 class="sr">한눈에 보기</h2>
    <div class="hero"><div class="when num">2026.11.14 (토) – 11.16 (월) · 대구 ↔ 제주</div>
      <div class="big num">${big}</div><div class="sub">${sub}</div></div>
    <div class="card">${nextHtml}</div>
    ${alerts ? `<div class="sec">확인이 필요한 것</div>${alerts}` : ''}
    <div class="sec">일정 (확정된 예약만 · 세부 일정은 추후 추가)</div>${days}
    <div class="sec">바로 가기</div>
    <div class="card"><div class="btns" style="margin-top:0">
      <a class="btn pri" href="${esc(TRIP.stay.naver)}" target="_blank" rel="noopener">${ICON.map}숙소 길찾기</a>
      <a class="btn" href="${telHref(TRIP.car.tel)}">${ICON.tel}렌터카 지점</a>
      <button class="btn" type="button" data-go="food">${ICON.food}맛집 찾기</button></div></div>
    <div class="sec">연락처</div>
    <div class="card"><table>${contacts}</table></div>
    <div class="sec">메모 (이 기기에만 저장)</div>
    <div class="card"><textarea id="memo" placeholder="여행 중 적어 둘 것">${esc(store.get('memo', ''))}</textarea></div>
    <p class="small muted" style="text-align:center;margin:18px 0 0">마지막 갱신 ${esc(TRIP.updated)}</p>`;
  $('#memo').addEventListener('input', e => store.set('memo', e.target.value));
}

// ── 항공 ──────────────────────────────────────────────────────
function feeRows(f) {
  const left = dayNum(f.date) - kstDay();
  const gone = Date.now() > kst(f.date + 'T' + f.dep).getTime();
  return f.fees.map(r => {
    const on = gone ? r[1] < 0 : (left >= r[0] && left <= r[1]);
    return `<tr${on ? ' class="now"' : ''}><td>${esc(r[2])}${on ? ' ← 지금' : ''}</td><td class="num" style="text-align:right">${esc(r[3])}</td></tr>`;
  }).join('');
}

    return `
    <article class="card pass">
      <div class="hd"><span>${esc(f.tag)} · ${esc(nm(f.who))}</span><span class="num">${+f.date.slice(5, 7)}/${+f.date.slice(8)} (${f.dow})</span></div>

          <dt>수속 마감</dt><dd class="num">${f.close}${f.advise ? ` <span class="muted">· ${f.advise}까지 수속 권장</span>` : ''}</dd>
          <dt>수하물</dt><dd>${esc(f.bag)}</dd>
          <dt>운임</dt><dd>${esc(f.fare)} <span class="muted">· ${esc(f.status)}${f.aircraft ? ' · ' + esc(f.aircraft) : ''}</span></dd>
        </dl>
        ${priv}
        <details><summary>${esc(f.feeTitle)}</summary><table>${feeRows(f)}</table></details>

  }).join('');
  $('#v-flight').innerHTML = `<h2>항공</h2>${cards}
    <div class="sec">탑승 전에 알아 둘 것</div>
    <div class="card"><ul class="plain">${TRIP.flightNotes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>

}
function payCard() {

// ── 맛집 ──────────────────────────────────────────────────────
const AREAS = [['', '전체'], ['N', '신제주'], ['O', '구제주'], ['W', '서부 (애월·한림)'], ['E', '동부 (조천·성산)'], ['S', '서귀포 시내'], ['J', '중문·안덕·대정'], ['P', '남원·표선']];
const GRADES = [['', '전체'], ['top', 'AA·A'], ['five', '5 이상'], ['fav', '찜한 곳']];
const RANK = { AA: 0, A: 1, 5: 2, 4: 3, 3: 4, 2: 5, '못가봄': 6, '': 7 };
const SRC = { 1: '평가 목록', 2: '관내 맛집 책자', 3: '추가 표' };
const fstate = { q: '', area: '', grade: '' };
let favs = new Set(store.get('fav', []));
const fkey = r => r.n + '|' + (r.t[0] || '');

function foodList() {
  const q = fstate.q.trim().toLowerCase().replace(/\s+/g, '');
  const rows = FOOD.filter(r => {
    if (fstate.area && r.a !== fstate.area) return false;
    if (fstate.grade === 'top' && !(r.g === 'AA' || r.g === 'A')) return false;
    if (fstate.grade === 'five' && !(RANK[r.g] <= 2)) return false;
    if (fstate.grade === 'fav' && !favs.has(fkey(r))) return false;
    if (q && !r.k.includes(q)) return false;
    return true;
  }).sort((x, y) => RANK[x.g] - RANK[y.g] || x.n.localeCompare(y.n, 'ko'));
  $('#fcount').textContent = `${rows.length}곳` + (rows.length !== FOOD.length ? ` / 전체 ${FOOD.length}곳` : '');
  $('#flist').innerHTML = rows.map(r => `
    <div class="card food">
      <div class="nm"><b>${esc(r.n)}${r.alt ? ` <small>(${esc(r.alt)})</small>` : ''}</b>${r.g ? `<span class="grade g-${esc(r.g)}">${esc(r.g)}</span>` : ''}</div>
      <div class="meta">${esc(r.c)}${r.l ? ' · ' + esc(r.l) : ''}${r.u ? ' · ' + esc(r.u) : ''}</div>
      ${r.m ? `<div class="memo">${esc(r.m)}</div>` : ''}
      ${r.d ? `<div class="meta">${esc(r.d)}</div>` : ''}
      <div class="row">
        ${r.t.map(t => `<a class="btn mini sea" href="${telHref(t)}">${ICON.tel}<span class="num">${esc(telText(t))}</span></a>`).join('')}
        <a class="btn mini" href="${naverSearch('제주 ' + r.n.replace(/\s*\(.*?\)/g, ''))}" target="_blank" rel="noopener">${ICON.map}지도</a>
        ${r.s.map(s => `<span class="src">${SRC[s]}</span>`).join('')}
        <button class="star" type="button" aria-label="찜" aria-pressed="${favs.has(fkey(r))}" data-fav="${esc(fkey(r))}">${ICON.star}</button>
      </div>
    </div>`).join('') || '<p class="muted" style="text-align:center;padding:30px 0">조건에 맞는 곳이 없습니다.</p>';
}
function chipRow(id, list, cur) {
  return `<div class="chips" id="${id}">${list.map(([v, t]) => `<button class="chip" type="button" data-v="${v}" aria-pressed="${v === cur}">${esc(t)}</button>`).join('')}</div>`;
}
function renderFood() {
  $('#v-food').innerHTML = `<h2>맛집</h2>
    <div class="card alert"><p style="margin:0" class="small"><b>오래된 목록입니다.</b> 스캔한 종이 목록을 옮겨 적은 것이라 폐업·이전했거나 전화번호가 바뀐 곳이 있을 수 있습니다. 가기 전에 지도 검색이나 전화로 영업 여부를 확인하세요.</p></div>
    <div class="search"><input id="fq" type="search" inputmode="search" placeholder="상호, 메뉴, 동네로 찾기 (예: 고기국수, 애월, 흑돼지)" value="${esc(fstate.q)}">
      ${chipRow('farea', AREAS, fstate.area)}${chipRow('fgrade', GRADES, fstate.grade)}</div>
    <div class="count" id="fcount"></div>
    <div id="flist"></div>
    <div class="sec">평가 기준 (평가 목록의 표기 그대로)</div>
    <div class="card small"><b>AA</b> 강력 추천 · <b>A</b> 자신 있게 추천 · <b>5</b> 추천할 수 있음 · <b>4</b> 근처에서 괜찮은 편 · <b>3</b> 무난함 · <b>2</b> 한두 번 가 볼 만함 · <b>못가봄</b> 평가자가 가 보지 않음.
      평가가 없는 곳은 다른 두 목록(관내 맛집 책자, 추가 표)에만 실린 곳입니다.</div>`;
  $('#fq').addEventListener('input', e => { fstate.q = e.target.value; foodList(); });
  for (const [id, key] of [['farea', 'area'], ['fgrade', 'grade']]) {
    $('#' + id).addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      fstate[key] = b.dataset.v;
      for (const c of $('#' + id).children) c.setAttribute('aria-pressed', c === b);
      foodList();
    });
  }
  foodList();
}

// ── 체크리스트 ────────────────────────────────────────────────
function renderCheck() {
  const done = store.get('chk', {});
  const custom = store.get('chkCustom', []);
  const all = TRIP.checklist.flatMap(g => g.items.map(i => i[0])).concat(custom.map(c => c.id));
  const n = all.filter(id => done[id]).length;
  const li = (id, text, del) => `<li><label><input type="checkbox" data-chk="${esc(id)}"${done[id] ? ' checked' : ''}><span>${esc(text)}</span>${del ? `<button class="del" type="button" data-del="${esc(id)}" aria-label="삭제">×</button>` : ''}</label></li>`;
  $('#v-check').innerHTML = `<h2>준비</h2>
    <div class="small muted num">${n} / ${all.length} 완료</div>
    <div class="bar"><i style="width:${all.length ? Math.round(n / all.length * 100) : 0}%"></i></div>
    ${TRIP.checklist.map(g => `<div class="sec">${esc(g.title)}</div><div class="card"><ul class="chk">${g.items.map(i => li(i[0], i[1])).join('')}</ul></div>`).join('')}
    <div class="sec">내가 추가한 것</div>
    <div class="card"><ul class="chk">${custom.map(c => li(c.id, c.text, true)).join('')}</ul>
      <form class="add" id="addForm"><input id="addIn" placeholder="챙길 것 추가" autocomplete="off"><button class="btn pri" type="submit">추가</button></form></div>
    <p class="small muted" style="text-align:center">체크 상태는 이 기기에만 저장됩니다.</p>`;
  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#addIn').value.trim(); if (!v) return;
    custom.push({ id: 'c' + Date.now(), text: v }); store.set('chkCustom', custom); renderCheck();
  });
}

// ── 화면 전환 ─────────────────────────────────────────────────
const TABS = [['home', '홈'], ['flight', '항공'], ['car', '렌터카'], ['stay', '숙소'], ['food', '맛집'], ['check', '준비']];
const RENDER = { home: renderHome, flight: renderFlights, car: renderCar, stay: renderStay, food: renderFood, check: renderCheck };
let cur = 'home';
function go(tab, keepScroll) {
  if (!RENDER[tab]) tab = 'home';
  cur = tab;
  try { sessionStorage.setItem(NS + 'tab', tab); } catch {}
  for (const [id] of TABS) $('#v-' + id).classList.toggle('on', id === tab);
  for (const b of $('#tabs').children) b.toggleAttribute('aria-current', false), b.dataset.tab === tab && b.setAttribute('aria-current', 'page');
  RENDER[tab]();
  if (!keepScroll) window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1600);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove();
  }
  toast('복사했습니다: ' + text);
}

// ── 잠금 ──────────────────────────────────────────────────────
function b64bytes(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function decryptWith(keyStr) {
  const raw = b64bytes(keyStr);
  if (raw.length !== 16) throw new Error('bad key');
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const buf = b64bytes(PRIV.enc);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function keyFrom(text) {
  const m = /[#&?]k=([A-Za-z0-9_-]+)/.exec(text);
  return m ? m[1] : text.trim();
}
function paintLock() {
  const b = $('#lockBtn');
  if (PRIV.plain) { b.hidden = true; return; }
  b.hidden = false;
  b.className = 'pill ' + (P ? 'open' : 'lock');
  b.innerHTML = (P ? ICON.open + '열림' : ICON.lock + '잠김');
}
async function initLock() {
  if (PRIV.plain) { P = PRIV.plain; return; }
  const cands = [];
  if (/[#&]k=/.test(location.hash)) cands.push(keyFrom(location.hash));
  const saved = store.get('k', ''); if (saved) cands.push(saved);
  for (const k of cands) {
    try { P = await decryptWith(k); store.set('k', k); return; } catch {}
  }
}
function openUnlock() {
  if (P || PRIV.plain) return;
  $('#keyErr').textContent = ''; $('#keyIn').value = '';
  $('#unlock').showModal();
}
$('#keyGo').addEventListener('click', async () => {
  const k = keyFrom($('#keyIn').value);
  try {
    P = await decryptWith(k); store.set('k', k);
    $('#unlock').close(); paintLock(); go(cur, true); toast('잠금을 풀었습니다');
  } catch { $('#keyErr').textContent = '열쇠가 맞지 않습니다. 받은 주소를 통째로 붙여 넣어 보세요.'; }
});
$('#keyNo').addEventListener('click', () => $('#unlock').close());
$('#lockBtn').addEventListener('click', () => {
  if (!P) return openUnlock();
  if (confirm('이 기기에서 다시 잠글까요? 열쇠를 다시 넣어야 예약번호가 보입니다.')) {
    P = null; store.set('k', ''); history.replaceState(null, '', location.pathname + location.search); paintLock(); go(cur, true);
  }
});

// ── 공통 이벤트 ───────────────────────────────────────────────
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) { e.preventDefault(); return copyText(c.dataset.copy); }
  if (e.target.closest('[data-unlock]')) return openUnlock();
  const f = e.target.closest('[data-fav]');
  if (f) {
    const k = f.dataset.fav; favs.has(k) ? favs.delete(k) : favs.add(k);
    store.set('fav', [...favs]); f.setAttribute('aria-pressed', favs.has(k));
    if (fstate.grade === 'fav') foodList();
    return;
  }
  const d = e.target.closest('[data-del]');
  if (d) {
    e.preventDefault();
    store.set('chkCustom', store.get('chkCustom', []).filter(x => x.id !== d.dataset.del)); return renderCheck();
  }
  if (e.target.closest('a,button,input,textarea,summary,label')) {
    const g0 = e.target.closest('button[data-go]'); if (g0) go(g0.dataset.go);
    return;
  }
  const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go);
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-chk]'); if (!c) return;
  const done = store.get('chk', {}); done[c.dataset.chk] = c.checked; store.set('chk', done); renderCheck();
});

$('#tabs').innerHTML = TABS.map(([id, t]) => `<button type="button" data-tab="${id}">${ICON[id]}<span>${t}</span></button>`).join('');
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.tab); });

(async () => {
  await initLock();
  paintLock();
  let tab = 'home';
  try { tab = sessionStorage.getItem(NS + 'tab') || 'home'; } catch {}
  go(tab);
  setInterval(() => { if (cur === 'home' && document.activeElement?.id !== 'memo') go('home', true); }, 60000);
})();
</script>
